version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always

    environment:
      POSTGRES_DB: peopledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  springboot:
    build: .

    container_name: springboot-app

    depends_on:
      - postgres

    ports:
      - "8080:8080"

volumes:
  postgres-data: